name: project_calendar
description: Aplikasi manajemen project berbasis kalender.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # SDK package (not pub.dev): needed so date pickers render in Indonesian.
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.2.2
  android_alarm_manager_plus: ^4.0.4
  flutter_markdown: ^0.7.3
  table_calendar: ^3.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  permission_handler: ^11.3.1
  uuid: ^4.5.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  fonts:
    - family: MinecraftCustom
      fonts:
        - asset: assets/fonts/minecraft.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  adaptive_icon_background: "#0E1116"
  adaptive_icon_foreground: "icon_foreground.png"
  min_sdk_android: 23
  remove_alpha_ios: false
